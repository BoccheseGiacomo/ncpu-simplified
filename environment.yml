name: slackenv
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - flask>=3.0,<4
  - ipykernel>=6.29,<7
  - ipywidgets>=8.1,<9
  - jupyterlab>=4.2,<5
  - matplotlib>=3.8,<4
  - numpy>=1.26,<3
  - pillow>=10,<12
  - pytest>=8,<9
  - pip
  - pip:
      - -e .
